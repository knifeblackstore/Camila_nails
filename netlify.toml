[build]
  command = "npm run build"
  publish = "dist"

# Redirige las llamadas a la API hacia el backend en Render
[[redirects]]
  from = "/api/*"
  to = "https://camila-nails.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://camila-nails.onrender.com/uploads/:splat"
  status = 200
  force = true

# Soporte para React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
