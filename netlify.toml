[build]
  command = "npm run build"
  publish = "dist"

# Redirige las llamadas a la API hacia el backend en la nube
[[redirects]]
  from = "/api/*"
  to = ":BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = ":BACKEND_URL/uploads/:splat"
  status = 200
  force = true

# Soporte para React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
